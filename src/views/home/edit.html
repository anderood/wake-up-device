<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Dispositivo</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #111827 55%, #1e293b 100%);
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.25rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #94a3b8;
    }

    form {
      display: grid;
      gap: 18px;
      padding: 24px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.72);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    label {
      display: grid;
      gap: 8px;
      color: #cbd5e1;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.92);
      color: #e5e7eb;
      font: inherit;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    button,
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 12px;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }

    button {
      border: 0;
      background: #2563eb;
      cursor: pointer;
    }

    a {
      border: 1px solid rgba(148, 163, 184, 0.32);
      background: rgba(15, 23, 42, 0.7);
    }

    @media (max-width: 560px) {
      main {
        width: min(100% - 24px, 720px);
        padding: 28px 0;
      }

      .actions {
        flex-direction: column-reverse;
      }

      button,
      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Editar Dispositivo</h1>
      <p>Atualize as informacoes do dispositivo selecionado.</p>
    </header>

    <form method="post" action="/device/1/update">
      <label>
        Nome
        <input type="text" name="name" value="TV da Sala" required>
      </label>

      <label>
        Tipo
        <select name="type" required>
          <option value="TV" selected>TV</option>
          <option value="Computador">Computador</option>
        </select>
      </label>

      <label>
        Local
        <input type="text" name="location" value="Sala" required>
      </label>

      <label>
        Endereco MAC
        <input type="text" name="macAddress" value="00:11:22:33:44:55" required>
      </label>

      <div class="actions">
        <a href="/">Cancelar</a>
        <button type="submit">Salvar alteracoes</button>
      </div>
    </form>
  </main>
</body>
</html>
