[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-up-device-worker"
version = "0.1.0"
description = "Durable EC2 scheduling worker for Wake Up Device"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "botocore>=1.34,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
